<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blink Enterprise Survey Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #F3F4F6; }
        .bg-blink-orange { background-color: #F26522; }
        .text-blink-orange { color: #F26522; }
        .bg-charcoal { background-color: #2D3748; }
        @media print {
            body { background-color: white; }
            .no-print { display: none !important; }
            .shadow-md { box-shadow: none !important; border: 1px solid #e5e7eb; }
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 bg-charcoal z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
            <div class="text-4xl font-bold text-blink-orange mb-2">▶blink</div>
            <p class="text-gray-500 mb-6 text-sm">تسجيل الدخول للنظام (System Login)</p>
            
            <form onsubmit="handleRealLogin(event)" class="space-y-4 text-right">
                <div>
                    <label class="block text-sm font-bold mb-1">اسم المستخدم</label>
                    <input type="text" id="login-username" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blink-orange outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">كلمة المرور</label>
                    <input type="password" id="login-password" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blink-orange outline-none">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden font-bold"></div>
                <button type="submit" id="login-btn" class="w-full bg-blink-orange text-white font-bold py-3 rounded-lg hover:opacity-90 transition-opacity mt-4">
                    دخول
                </button>
            </form>
        </div>
    </div>

    <!-- APP HEADER -->
    <header class="bg-white shadow-sm p-4 flex justify-between items-center no-print sticky top-0 z-40 hidden" id="app-header">
        <div class="flex items-center gap-6">
            <div class="text-3xl font-bold text-blink-orange">▶blink</div>
            <nav class="hidden md:flex gap-2 border-r pr-6">
                <button onclick="switchView('master')" id="nav-master" class="px-4 py-2 bg-gray-100 font-bold rounded-md">الرئيسية</button>
                <button onclick="switchView('settings')" id="nav-settings" class="px-4 py-2 text-gray-500 rounded-md hover:bg-gray-100 hidden">إعدادات النظام</button>
            </nav>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="window.print()" class="bg-gray-100 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-200 font-bold">📄 PDF</button>
            <div class="text-left border-l pl-4">
                <div class="font-bold text-gray-900" id="current-user-name">--</div>
                <div class="text-xs text-gray-500" id="current-user-role">--</div>
            </div>
            <button onclick="logout()" class="text-red-500 hover:bg-red-50 p-2 rounded-lg text-sm font-bold border border-red-200">خروج</button>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto p-6 hidden" id="main-content">
        
        <!-- VIEW 1: MASTER DASHBOARD -->
        <div id="view-master" class="block">
            <!-- Dynamic KPIs: Start at 0 -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-white p-6 rounded-xl shadow-sm text-center border-t-4 border-blink-orange">
                    <div class="text-blink-orange text-4xl font-bold mb-2" id="kpi-total-surveys">0</div>
                    <div class="text-gray-600">إجمالي التقييمات</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm text-center border-t-4 border-blink-orange">
                    <div class="text-blink-orange text-4xl font-bold mb-2" id="kpi-avg-score">0</div>
                    <div class="text-gray-600">متوسط أداء الفروع</div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm text-center border-t-4 border-blink-orange">
                    <div class="text-blink-orange text-4xl font-bold mb-2" id="kpi-active-branches">0</div>
                    <div class="text-gray-600">الفروع النشطة</div>
                </div>
            </div>

            <!-- Real Database Heatmap -->
            <div class="bg-white rounded-xl shadow-sm p-6">
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="font-bold">الفروع (تظهر فقط الفروع التي بها بيانات)</h3>
                </div>
                <div class="grid grid-cols-8 md:grid-cols-10 gap-2" id="heatmap-container">
                    <div class="col-span-10 text-center py-8 text-gray-400">لا توجد بيانات للفروع حتى الآن.</div>
                </div>
            </div>
        </div>

        <!-- VIEW 2: BRANCH PERFORMANCE CARD -->
        <div id="view-branch" class="hidden">
            <button onclick="switchView('master')" class="mb-4 text-blink-orange font-bold flex items-center gap-2 no-print">
                <span>◀</span> العودة
            </button>
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div class="bg-white p-8 rounded-xl shadow-sm text-center border-t-4 border-blink-orange">
                    <div class="text-gray-500 mb-2 font-bold text-lg" id="card-branch-name">--</div>
                    <div class="text-8xl font-bold text-blink-orange mb-4" id="card-overall">0</div>
                    <div class="text-gray-500 mb-6">إجمالي الاستبيانات: <span id="card-total">0</span></div>
                </div>
                <div class="bg-white p-6 rounded-xl shadow-sm lg:col-span-2">
                    <div class="space-y-6">
                        <div class="flex items-center gap-4">
                            <div class="w-10 font-bold" id="card-speed">0</div>
                            <div class="flex-grow bg-gray-200 h-6 rounded-full"><div class="bg-blink-orange h-full rounded-full" id="bar-speed" style="width: 0%"></div></div>
                            <div class="w-32 font-bold text-right">سرعة الخدمة</div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-10 font-bold" id="card-accuracy">0</div>
                            <div class="flex-grow bg-gray-200 h-6 rounded-full"><div class="bg-green-600 h-full rounded-full" id="bar-accuracy" style="width: 0%"></div></div>
                            <div class="w-32 font-bold text-right">دقة الطلب</div>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="w-10 font-bold" id="card-quality">0</div>
                            <div class="flex-grow bg-gray-200 h-6 rounded-full"><div class="bg-blink-orange h-full rounded-full" id="bar-quality" style="width: 0%"></div></div>
                            <div class="w-32 font-bold text-right">جودة المنتج</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- VIEW 3: SETTINGS / CREATE USERS -->
        <div id="view-settings" class="hidden">
            <div class="bg-white p-6 rounded-xl shadow-sm max-w-md">
                <h3 class="font-bold text-lg mb-4 text-blink-orange">إنشاء مستخدم جديد</h3>
                <form onsubmit="handleCreateUser(event)" class="space-y-3">
                    <input type="text" id="new-user" placeholder="اسم المستخدم" required class="w-full p-2 border rounded">
                    <input type="password" id="new-pass" placeholder="كلمة المرور" required class="w-full p-2 border rounded">
                    <select id="new-role" class="w-full p-2 border rounded">
                        <option value="admin">مدير نظام (Admin)</option>
                        <option value="branch">مشرف فرع (Branch)</option>
                    </select>
                    <input type="text" id="new-branch-id" placeholder="رقم الفرع (اختياري، للمشرفين فقط)" class="w-full p-2 border rounded">
                    <button type="submit" class="bg-blink-orange text-white w-full py-2 rounded font-bold">حفظ المستخدم</button>
                    <div id="user-msg" class="text-sm font-bold mt-2"></div>
                </form>
            </div>
        </div>
    </main>

    <script>
        let session = null;

        // REAL LOGIN LOGIC
        async function handleRealLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-btn');
            const err = document.getElementById('login-error');
            btn.innerText = 'جاري التحقق...';
            err.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('login-username').value,
                        password: document.getElementById('login-password').value
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    session = data.user;
                    document.getElementById('current-user-name').innerText = session.username;
                    document.getElementById('current-user-role').innerText = session.role;
                    
                    document.getElementById('login-screen').style.display = 'none';
                    document.getElementById('app-header').classList.remove('hidden');
                    document.getElementById('main-content').classList.remove('hidden');
                    
                    if(session.role === 'admin') {
                        document.getElementById('nav-settings').classList.remove('hidden');
                        loadRealData();
                    } else {
                        // If branch supervisor, only show their branch
                        loadRealData(session.branch_id);
                    }
                } else {
                    err.innerText = data.message || data.error || 'خطأ في الاتصال بقاعدة البيانات (Check Vercel Database Settings)';
                    err.classList.remove('hidden');
                }
            } catch (error) {
                err.innerText = 'حدث خطأ في الاتصال بالسيرفر (Server/Database Connection Error)';
                err.classList.remove('hidden');
            }
            btn.innerText = 'دخول';
        }

        // REAL USER CREATION
        async function handleCreateUser(e) {
            e.preventDefault();
            const msg = document.getElementById('user-msg');
            msg.innerText = 'جاري الحفظ...';
            msg.className = 'text-sm font-bold mt-2 text-gray-500';

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('new-user').value,
                        password: document.getElementById('new-pass').value,
                        role: document.getElementById('new-role').value,
                        branch_id: document.getElementById('new-branch-id').value
                    })
                });
                if(res.ok) {
                    msg.innerText = 'تم إنشاء المستخدم بنجاح!';
                    msg.className = 'text-sm font-bold mt-2 text-green-600';
                    e.target.reset();
                } else {
                    throw new Error('فشل الحفظ');
                }
            } catch(err) {
                msg.innerText = 'حدث خطأ. تأكد من عدم تكرار اسم المستخدم.';
                msg.className = 'text-sm font-bold mt-2 text-red-500';
            }
        }

        // FETCH REAL SURVEY DATA
        async function loadRealData(filterBranch = null) {
            const container = document.getElementById('heatmap-container');
            try {
                const res = await fetch('/api/branches');
                let branches = await res.json();

                if(filterBranch) {
                    branches = branches.filter(b => b.branch_id == filterBranch);
                }

                if (branches.length === 0) {
                    container.innerHTML = '<div class="col-span-10 text-center py-8 font-bold text-gray-500">البيانات صفر. لا توجد استبيانات حالياً.</div>';
                    return;
                }

                // Update Real Master KPIs
                const totalSurveys = branches.reduce((sum, b) => sum + Number(b.total_surveys), 0);
                const avgScore = Math.round(branches.reduce((sum, b) => sum + Number(b.overall_score), 0) / branches.length);
                
                document.getElementById('kpi-total-surveys').innerText = totalSurveys;
                document.getElementById('kpi-avg-score').innerText = avgScore;
                document.getElementById('kpi-active-branches').innerText = branches.length;

                // Render Dynamic Heatmap ONLY for existing branches
                container.innerHTML = '';
                branches.forEach(branch => {
                    let color = 'bg-green-500';
                    if (branch.overall_score < 60) color = 'bg-red-500';
                    else if (branch.overall_score < 80) color = 'bg-yellow-500';

                    let btn = document.createElement('button');
                    btn.className = `${color} text-white font-bold py-3 rounded text-sm hover:opacity-80 flex flex-col items-center justify-center`;
                    btn.innerHTML = `<span>فرع</span><span>${branch.branch_id}</span>`;
                    
                    btn.onclick = () => {
                        document.getElementById('card-branch-name').innerText = `فرع رقم ${branch.branch_id}`;
                        document.getElementById('card-total').innerText = branch.total_surveys;
                        document.getElementById('card-overall').innerText = branch.overall_score;
                        
                        document.getElementById('card-speed').innerText = branch.speed_score;
                        document.getElementById('bar-speed').style.width = `${branch.speed_score}%`;
                        
                        document.getElementById('card-accuracy').innerText = branch.accuracy_score;
                        document.getElementById('bar-accuracy').style.width = `${branch.accuracy_score}%`;
                        
                        document.getElementById('card-quality').innerText = branch.quality_score;
                        document.getElementById('bar-quality').style.width = `${branch.quality_score}%`;
                        
                        switchView('branch');
                    };
                    container.appendChild(btn);
                });

                // If branch user, jump straight to their card
                if(filterBranch && branches.length > 0) {
                    container.firstChild.click();
                }

            } catch (err) {
                container.innerHTML = '<div class="col-span-10 text-center py-8 text-red-500">خطأ في جلب البيانات</div>';
            }
        }

        function switchView(viewName) {
            ['master', 'branch', 'settings'].forEach(v => {
                document.getElementById(`view-${v}`).style.display = 'none';
                if(document.getElementById(`nav-${v}`)) document.getElementById(`nav-${v}`).className = 'px-4 py-2 text-gray-500 rounded-md hover:bg-gray-100';
            });
            document.getElementById(`view-${viewName}`).style.display = 'block';
            if(document.getElementById(`nav-${viewName}`)) document.getElementById(`nav-${viewName}`).className = 'px-4 py-2 bg-gray-100 font-bold rounded-md text-gray-700';
        }

        function logout() {
            session = null;
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('main-content').classList.add('hidden');
            
            // Reset to 0 visually on logout
            document.getElementById('kpi-total-surveys').innerText = '0';
            document.getElementById('kpi-avg-score').innerText = '0';
            document.getElementById('kpi-active-branches').innerText = '0';
            document.getElementById('heatmap-container').innerHTML = '';
        }
    </script>
</body>
</html>
